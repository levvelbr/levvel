name: "Frontend CI/CD (Vite / React)"

on:
  push:
    branches: [ "frontend" ]
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/package.json'
      - 'frontend/vite.config.js'
      - 'frontend/vite.config.ts'
      - '.github/workflows/frontend-ci-cd.yml'

jobs:
  build-and-test:
    name: "1. Validar Build e Código"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # <--- Garante que os comandos rodem na pasta do React

    steps:
      - name: "Checkout Código"
        uses: actions/checkout@v4

      - name: "Configurar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json' # <--- Local do lockfile

      - name: "Instalar Dependências"
        run: npm ci

      - name: "Executar Build de Teste (Vite)"
        run: npm run build
        env:
          VITE_API_URL: "https://api.levvel.com.br/v1"

  deploy-frontend:
    name: "2. Deploy para Vercel"
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # <--- Garante que a CLI da Vercel execute dentro da pasta do frontend

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: "Install Vercel CLI"
        run: npm install --global vercel

      - name: "Pull Vercel Environment Information"
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: "Build Project Artifacts"
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: "Deploy Project Artifacts to Vercel"
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
