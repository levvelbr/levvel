name: "Frontend CI/CD (Vite / Vue)"

on:
  push:
    branches: [ "frontend" ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/frontend-ci-cd.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Código"
        uses: actions/checkout@v4

      - name: "Configurar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: "Instalar Dependências"
        run: npm ci

      - name: Executar Build de Produção (Vite)
        run: npm run build
        env:
          VITE_API_URL: "https://api.levvel.com.br/v1" # Injeta URL de produção no build

  deploy-frontend:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Instala a CLI oficial da Vercel globalmente na máquina do GitHub Actions
      - name: "Install Vercel CLI"
        run: npm install --global vercel

      # Puxa as configurações e metadados do projeto da Vercel (evita arquivos locais expostos)
      - name: "Pull Vercel Environment Information"
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Compila os arquivos de produção (gera a pasta dist/ otimizada) dentro do ambiente Vercel
      - name: "Build Project Artifacts"
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Faz o upload dos artefatos pré-compilados diretamente para a infraestrutura de produção
      - name: "Deploy Project Artifacts to Vercel"
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
